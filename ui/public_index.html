<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orchestrator Public Readonly UI</title>
  <link rel="stylesheet" href="/ui/static/app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">claude-code-fleet-orchestrator</p>
        <h1>Public Readonly Plan UI</h1>
      </div>
      <div class="topbar-controls">
        <div class="last-updated">
          <span>Last refresh</span>
          <strong id="last-updated">never</strong>
        </div>
        <label class="pause-toggle" title="Freezes UI auto-refresh while reading. Does NOT pause sessions or the discipline engine.">
          <input type="checkbox" id="pause-toggle">
          <span>Pause UI refresh</span>
        </label>
      </div>
    </header>

    <section class="sessions-panel panel">
      <div class="panel-header">
        <h2>Sessions</h2>
        <p>Current task and next ready task for the public session set.</p>
      </div>
      <div id="sessions-strip" class="sessions-strip"></div>
    </section>

    <main class="workspace">
      <aside class="projects-panel panel">
        <div class="panel-header">
          <h2>Projects</h2>
          <p>Supervisor-scoped project inventory from <code>/api/sessions/{session}/projects</code>.</p>
        </div>
        <div id="projects-list" class="projects-list"></div>
      </aside>

      <section class="details-panel panel">
        <div id="project-detail" class="project-detail empty-state">
          Select a project to inspect its phases and tasks.
        </div>
      </section>
    </main>
  </div>

  <script>
    window.ORCH_PUBLIC_SESSIONS = __PUBLIC_SESSIONS__;
  </script>
  <script src="/ui/static/public-app.js"></script>
</body>
</html>
