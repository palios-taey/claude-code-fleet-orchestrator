<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orchestrator Plan UI</title>
  <link rel="stylesheet" href="/ui/static/app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">claude-code-fleet-orchestrator</p>
        <h1>Session-first Plan UI</h1>
      </div>
      <div class="topbar-controls">
        <div class="last-updated">
          <span>Last refresh</span>
          <strong id="last-updated">never</strong>
        </div>
        <label class="pause-toggle" title="Freezes UI auto-refresh while reading. Does NOT pause sessions or the discipline engine — that's per-session in Stage C.">
          <input type="checkbox" id="pause-toggle">
          <span>Pause UI refresh</span>
        </label>
      </div>
    </header>

    <section class="sessions-panel panel">
      <div class="panel-header">
        <h2>Sessions</h2>
        <p>Current task and next ready task for the first-cut fleet sessions.</p>
      </div>
      <div id="sessions-strip" class="sessions-strip"></div>
    </section>

    <main class="workspace">
      <aside class="projects-panel panel">
        <div class="panel-header">
          <h2>Projects</h2>
          <p>Active plan inventory from <code>/api/projects</code>.</p>
        </div>
        <div id="projects-list" class="projects-list"></div>
      </aside>

      <section class="details-panel panel">
        <div id="project-detail" class="project-detail empty-state">
          Select a project to inspect its phases, tasks, and user-stop-conditions.
        </div>
      </section>
    </main>

    <footer class="chat-bar panel" id="chat-bar">
      <div class="chat-bar-header">
        <button type="button" id="chat-expand-toggle" class="chat-expand-toggle"
                aria-expanded="false" aria-controls="chat-history-wrap">
          <span class="chat-expand-arrow" aria-hidden="true">▸</span>
          <span>Chat with <strong id="chat-target">conductor</strong></span>
        </button>
        <span id="chat-needs-you" class="status-badge blocked" hidden>needs you</span>
      </div>
      <div id="chat-history-wrap" class="chat-history-wrap" hidden>
        <div id="chat-open-questions" class="open-questions"></div>
        <div id="chat-history" class="chat-history" aria-live="polite"></div>
      </div>
      <form id="chat-form" class="chat-form">
        <label class="notify-type" title="Delivery type for the session inbox">
          <span class="visually-hidden">Type</span>
          <select id="notify-type">
            <option value="standard">standard</option>
            <option value="escalation">escalation</option>
            <option value="command">command</option>
            <option value="response_ready">response_ready</option>
          </select>
        </label>
        <label class="notify-input-wrap">
          <span class="visually-hidden">Message</span>
          <textarea id="chat-input" rows="2" placeholder="Message to conductor..."></textarea>
        </label>
        <div class="notify-actions">
          <button id="chat-submit" type="submit" disabled>Send</button>
          <span id="chat-status" class="notify-status" aria-live="polite"></span>
        </div>
      </form>
    </footer>
  </div>

  <template id="status-badge-template">
    <span class="status-badge"></span>
  </template>

  <dialog id="ref-dialog">
    <form method="dialog">
      <h2 id="ref-dialog-title">Reference</h2>
      <p id="ref-dialog-meta" class="muted"></p>
      <pre id="ref-dialog-content"></pre>
      <button id="ref-dialog-close" type="button">Close</button>
    </form>
  </dialog>

  <script src="/ui/static/app.js"></script>
</body>
</html>
