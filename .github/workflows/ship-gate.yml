# Ship-gate CI — the merge gate required by main's branch protection (context: ship-gate-acceptance).
#
# HONEST SCOPE: this currently runs an INTEGRATION e2e of the v1.7.0 project-scoped task-identity
# invariant (the guards the Family + Gatekeeper verified) against an ephemeral Neo4j. It is NOT yet a
# browser UI e2e — the check is NAMED for what it does
# (acceptance tests, ephemeral services) per the 2026-06-11 four-lane Chat review: a check name
# must never claim coverage it doesn't have. A real prod-UI e2e remains a planned, separate check. It needs Neo4j only (no fleet-notify):
# every identity guard raises before the notify path, happy-paths pass wake_owner_if_ready=False, and a
# tiny stub `identity` module satisfies the import check.
name: ship-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

jobs:
  ship-gate-acceptance:           # <- this job name IS the required status-check context on main
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: none
        ports:
          - 7687:7687
          - 7474:7474
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (+ httpx for starlette TestClient e2e, redis for the notify path)
        run: pip install -e . httpx redis
      - name: Stub notify import (most tests need Neo4j only; the wake-atomic test needs a real redis_connect)
        run: |
          mkdir -p "$RUNNER_TEMP/notifystub"
          cat > "$RUNNER_TEMP/notifystub/identity.py" <<'PYIDENT'
          import os, redis
          def redis_connect():
              return redis.Redis(
                  host=os.environ.get("ORCH_REDIS_HOST", "127.0.0.1"),
                  port=int(os.environ.get("ORCH_REDIS_PORT", "6379")),
                  decode_responses=True,
              )
          PYIDENT
          echo "PYTHONPATH=$RUNNER_TEMP/notifystub" >> "$GITHUB_ENV"
      - name: Ship-gate — generic operator env contract
        run: python tests/env_contract_acceptance.py
      - name: Ship-gate — promised feature flags stay default-on
        run: python tests/feature_flags_acceptance.py
      - name: Ship-gate — documented CLI and repo references match live code
        run: |
          python scripts/verify-doc-cli-drift.py
          python tests/doc_cli_drift_acceptance.py
      - name: Ship-gate — installed CLIs stay live-linked after editable install
        run: python tests/cli_entrypoint_drift_acceptance.py
      - name: Ship-gate — local bind is the mutable API security boundary
        run: python tests/localbind_acceptance.py
      - name: Ship-gate — shipped surfaces contain no private fleet identity
        run: python tests/fleet_identity_deumbilical_acceptance.py
      - name: Ship-gate — easy setup is install-safe and version-aligned
        run: python tests/easy_setup_acceptance.py
      - name: Wait for Neo4j (bolt)
        run: |
          python - <<'PY'
          import time, sys
          from neo4j import GraphDatabase
          for i in range(60):
              try:
                  d = GraphDatabase.driver("bolt://localhost:7687")
                  d.verify_connectivity(); d.close(); print("neo4j ready"); sys.exit(0)
              except Exception as e:
                  time.sleep(2)
          print("neo4j did not become ready"); sys.exit(1)
          PY
      - name: Ship-gate — identity-invariant integration e2e
        env:
          ORCH_NEO4J_URI: bolt://localhost:7687
          ORCH_NEO4J_DB: neo4j
          ORCH_REDIS_HOST: 127.0.0.1
          ORCH_REDIS_PORT: "6379"
          ORCH_DASHBOARD_URL: http://127.0.0.1:5002
        run: python tests/task_identity_acceptance.py
      - name: Ship-gate — self-contained-install e2e (de-umbilical paths + dynamic sessions + loopback)
