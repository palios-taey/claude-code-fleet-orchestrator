# Ship-gate CI — the merge gate required by main's branch protection (context: ship-gate-prod-ui-e2e).
#
# HONEST SCOPE: this currently runs an INTEGRATION e2e of the v1.7.0 project-scoped task-identity
# invariant (the guards the Family + Gatekeeper verified) against an ephemeral Neo4j. It is NOT yet a
# browser UI e2e — the job keeps the legacy required-check name so branch protection is satisfied; a
# real prod-UI e2e on a self-hosted runner is a planned upgrade. It needs Neo4j only (no fleet-notify):
# every identity guard raises before the notify path, happy-paths pass wake_owner_if_ready=False, and a
# tiny stub `identity` module satisfies the import check.
name: ship-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

jobs:
  ship-gate-prod-ui-e2e:          # <- this job name IS the required status-check context on main
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: none
        ports:
          - 7687:7687
          - 7474:7474
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (+ httpx for starlette TestClient e2e, redis for the notify path)
        run: pip install -e . httpx redis
      - name: Stub notify import (most tests need Neo4j only; the wake-atomic test needs a real redis_connect)
        run: |
          mkdir -p "$RUNNER_TEMP/notifystub"
          cat > "$RUNNER_TEMP/notifystub/identity.py" <<'PYIDENT'
          import os, redis
          def redis_connect():
              return redis.Redis(
                  host=os.environ.get("ORCH_REDIS_HOST", "127.0.0.1"),
                  port=int(os.environ.get("ORCH_REDIS_PORT", "6379")),
                  decode_responses=True,
              )
          PYIDENT
          echo "PYTHONPATH=$RUNNER_TEMP/notifystub" >> "$GITHUB_ENV"
      - name: Ship-gate — generic operator env contract
        run: python tests/env_contract_acceptance.py
      - name: Ship-gate — local bind is the mutable API security boundary
        run: python tests/localbind_acceptance.py
      - name: Wait for Neo4j (bolt)
        run: |
          python - <<'PY'
          import time, sys
          from neo4j import GraphDatabase
          for i in range(60):
              try:
                  d = GraphDatabase.driver("bolt://localhost:7687")
                  d.verify_connectivity(); d.close(); print("neo4j ready"); sys.exit(0)
              except Exception as e:
                  time.sleep(2)
          print("neo4j did not become ready"); sys.exit(1)
          PY
      - name: Ship-gate — identity-invariant integration e2e
        env:
          ORCH_NEO4J_URI: bolt://localhost:7687
          ORCH_NEO4J_DB: neo4j
          ORCH_REDIS_HOST: 127.0.0.1
          ORCH_REDIS_PORT: "6379"
          ORCH_DASHBOARD_URL: http://127.0.0.1:5002
        run: python tests/task_identity_acceptance.py
      - name: Ship-gate — self-contained-install e2e (de-umbilical paths + dynamic sessions + loopback)
        env:
          ORCH_NEO4J_URI: bolt://localhost:7687
          ORCH_NEO4J_DB: neo4j
          ORCH_REDIS_HOST: 127.0.0.1
          ORCH_REDIS_PORT: "6379"
          ORCH_DASHBOARD_URL: http://127.0.0.1:5002
        run: python tests/standalone_sessions_acceptance.py
      - name: Ship-gate — evidence gate (ws0 keystone — evidence-less 'completed' must be rejected)
        env:
          ORCH_NEO4J_URI: bolt://localhost:7687
          ORCH_NEO4J_DB: neo4j
          ORCH_REDIS_HOST: 127.0.0.1
          ORCH_REDIS_PORT: "6379"
          ORCH_DASHBOARD_URL: http://127.0.0.1:5002
        run: python tests/task_completion_evidence_acceptance.py
      - name: Ship-gate — bare task-id resolver (stop-engine phantom self-clear)
        env:
          ORCH_NEO4J_URI: bolt://localhost:7687
          ORCH_NEO4J_DB: neo4j
          ORCH_REDIS_HOST: 127.0.0.1
          ORCH_REDIS_PORT: "6379"
          ORCH_DASHBOARD_URL: http://127.0.0.1:5002
        run: python tests/bare_id_resolver_acceptance.py
      - name: Ship-gate — stop resolver must be active (no false stop on a pending tracking task)
        env:
          ORCH_NEO4J_URI: bolt://localhost:7687
          ORCH_NEO4J_DB: neo4j
          ORCH_REDIS_HOST: 127.0.0.1
          ORCH_REDIS_PORT: "6379"
          ORCH_DASHBOARD_URL: http://127.0.0.1:5002
        run: python tests/stop_resolver_active_acceptance.py
      - name: Ship-gate — dispatch is wake-atomic (failed wake reverts, no phantom live resolver)
        env:
          ORCH_NEO4J_URI: bolt://localhost:7687
          ORCH_NEO4J_DB: neo4j
          ORCH_REDIS_HOST: 127.0.0.1
          ORCH_REDIS_PORT: "6379"
          ORCH_DASHBOARD_URL: http://127.0.0.1:5002
        run: python tests/dispatch_wake_atomic_acceptance.py
      - name: Ship-gate — supervisor-dispatch stop-block (peer-owned ready work keeps the supervisor up)
        env:
          ORCH_NEO4J_URI: bolt://localhost:7687
          ORCH_NEO4J_DB: neo4j
          ORCH_REDIS_HOST: 127.0.0.1
          ORCH_REDIS_PORT: "6379"
          ORCH_DASHBOARD_URL: http://127.0.0.1:5002
        run: python tests/stop_supervisor_dispatch_acceptance.py
      - name: Ship-gate — update_task_status preserves owner on status-only update (no orphan)
        env:
          ORCH_NEO4J_URI: bolt://localhost:7687
          ORCH_NEO4J_DB: neo4j
          ORCH_REDIS_HOST: 127.0.0.1
          ORCH_REDIS_PORT: "6379"
          ORCH_DASHBOARD_URL: http://127.0.0.1:5002
        run: python tests/owner_preserve_acceptance.py
      - name: Ship-gate — no-fallback missing parents return explicit 4xx
        env:
          ORCH_NEO4J_URI: bolt://localhost:7687
          ORCH_NEO4J_DB: neo4j
          ORCH_REDIS_HOST: 127.0.0.1
          ORCH_REDIS_PORT: "6379"
          ORCH_DASHBOARD_URL: http://127.0.0.1:5002
        run: python tests/nofb_acceptance.py
      - name: Ship-gate — migration priority convention matches runtime readers
        env:
          ORCH_NEO4J_URI: bolt://localhost:7687
          ORCH_NEO4J_DB: neo4j
          ORCH_REDIS_HOST: 127.0.0.1
          ORCH_REDIS_PORT: "6379"
          ORCH_DASHBOARD_URL: http://127.0.0.1:5002
        run: python tests/migration_priority_acceptance.py
      - name: Ship-gate — state integrity (Neo4j/Redis convergence + startup schema)
        env:
          ORCH_NEO4J_URI: bolt://localhost:7687
          ORCH_NEO4J_DB: neo4j
          ORCH_REDIS_HOST: 127.0.0.1
          ORCH_REDIS_PORT: "6379"
          ORCH_DASHBOARD_URL: http://127.0.0.1:5002
        run: python tests/state_integrity_acceptance.py
      - name: Ship-gate — task claim is atomic under concurrency (F11 lock-first)
        env:
          ORCH_NEO4J_URI: bolt://localhost:7687
          ORCH_NEO4J_DB: neo4j
          ORCH_REDIS_HOST: 127.0.0.1
          ORCH_REDIS_PORT: "6379"
          ORCH_DASHBOARD_URL: http://127.0.0.1:5002
        run: python tests/claim_atomicity_acceptance.py
      - name: Ship-gate — create_question parameterized, no Cypher injection (F19)
        env:
          ORCH_NEO4J_URI: bolt://localhost:7687
          ORCH_NEO4J_DB: neo4j
          ORCH_REDIS_HOST: 127.0.0.1
          ORCH_REDIS_PORT: "6379"
          ORCH_DASHBOARD_URL: http://127.0.0.1:5002
        run: python tests/question_no_injection_acceptance.py
      - name: Ship-gate — canonical ready dependency predicate preserves behavior (F18)
        env:
          ORCH_NEO4J_URI: bolt://localhost:7687
          ORCH_NEO4J_DB: neo4j
          ORCH_REDIS_HOST: 127.0.0.1
          ORCH_REDIS_PORT: "6379"
          ORCH_DASHBOARD_URL: http://127.0.0.1:5002
        run: python tests/ready_definition_acceptance.py
      - name: Ship-gate — ws2 family amendments (readiness alignment + prefix isolation + lock shape)
        env:
          ORCH_NEO4J_URI: bolt://localhost:7687
          ORCH_NEO4J_DB: neo4j
          ORCH_REDIS_HOST: 127.0.0.1
          ORCH_REDIS_PORT: "6379"
          ORCH_DASHBOARD_URL: http://127.0.0.1:5002
        run: python tests/ws2_family_amends_acceptance.py
      - name: Ship-gate — dynamic wake packet endpoint is gated and provenance-bound
        env:
          ORCH_NEO4J_URI: bolt://localhost:7687
          ORCH_NEO4J_DB: neo4j
          ORCH_REDIS_HOST: 127.0.0.1
          ORCH_REDIS_PORT: "6379"
          ORCH_DASHBOARD_URL: http://127.0.0.1:5002
        run: python tests/wake_packet_acceptance.py
