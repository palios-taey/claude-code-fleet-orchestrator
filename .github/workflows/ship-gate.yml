# Ship-gate CI — the merge gate required by main's branch protection (context: ship-gate-acceptance).
#
# HONEST SCOPE: this currently runs an INTEGRATION e2e of the v1.7.0 project-scoped task-identity
# invariant (the guards the Family + Gatekeeper verified) against an ephemeral Neo4j. It is NOT yet a
# browser UI e2e — the check is NAMED for what it does
# (acceptance tests, ephemeral services) per the 2026-06-11 four-lane Chat review: a check name
# must never claim coverage it doesn't have. A real prod-UI e2e remains a planned, separate check. It needs Neo4j only (no fleet-notify):
# every identity guard raises before the notify path, happy-paths pass wake_owner_if_ready=False, and a
# tiny stub `identity` module satisfies the import check.
name: ship-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

jobs:
  ship-gate-acceptance:           # <- this job name IS the required status-check context on main
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: none
        ports:
          - 7687:7687
          - 7474:7474
      redis:
        image: redis:7
        ports:
          - 6379:6379
      notify-redis:
        image: redis:7
        ports:
          - 6380:6379
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (+ httpx for starlette TestClient e2e, redis for the notify path)
        run: pip install -e . httpx redis
      - name: Stub notify import (most tests need Neo4j only; the wake-atomic test needs a real redis_connect)
        run: |
          mkdir -p "$RUNNER_TEMP/notifystub"
          cat > "$RUNNER_TEMP/notifystub/identity.py" <<'PYIDENT'
          import os, redis
          def redis_connect():
              return redis.Redis(
                  host=os.environ.get("REDIS_HOST", "127.0.0.1"),
                  port=int(os.environ.get("REDIS_PORT", "6379")),
                  decode_responses=True,
              )
          PYIDENT
          echo "PYTHONPATH=$RUNNER_TEMP/notifystub" >> "$GITHUB_ENV"
      - name: Stub managed hook settings for dispatch acceptance
        run: |
          mkdir -p "$RUNNER_TEMP/hook-settings"
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "hook-settings"
          specs = {
              "codex.json": {
                  "SessionStart": "codex_session_start.py",
                  "PreToolUse": "codex_pre_tool.py",
                  "PostToolUse": "codex_post_tool.py",
                  "Stop": "codex_stop.py",
                  "UserPromptSubmit": "codex_user_prompt.py",
              },
              "gemini.json": {
                  "BeforeTool": "gemini_before_tool.py",
                  "AfterTool": "gemini_after_tool.py",
                  "BeforeAgent": "gemini_before_agent.py",
                  "AfterAgent": "gemini_after_agent.py",
              },
              "grok.json": {
                  "SessionStart": "grok_session_start.py",
                  "Stop": "grok_stop.py",
                  "UserPromptSubmit": "grok_user_prompt.py",
              },
          }
          for filename, events in specs.items():
              (root / filename).write_text(json.dumps({
                  "hooks": {
                      event: [{"hooks": [{"type": "command", "command": f"python3 /notify/hooks/{script}"}]}]
                      for event, script in events.items()
                  }
              }), encoding="utf-8")
          PY
          {
            echo "CODEX_HOOKS_PATH=$RUNNER_TEMP/hook-settings/codex.json"
            echo "GEMINI_SETTINGS_PATH=$RUNNER_TEMP/hook-settings/gemini.json"
            echo "GROK_HOOKS_PATH=$RUNNER_TEMP/hook-settings/grok.json"
          } >> "$GITHUB_ENV"
      - name: Ship-gate — generic operator env contract
        env:
          ORCH_DOTENV: empty
        run: python tests/env_contract_acceptance.py
      - name: Ship-gate — promised feature flags stay default-on
        run: python tests/feature_flags_acceptance.py
      - name: Ship-gate — documented CLI and repo references match live code
